name: Zapier CI

on:
  pull_request:
    paths:
      - 'zapier/**'
      - 'docs/**'
      - '.github/workflows/zapier-*.yml'
  push:
    branches:
      - main
    paths:
      - 'zapier/**'
      - 'docs/**'
      - '.github/workflows/zapier-*.yml'

concurrency:
  group: zapier-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zapier
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zapier/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate
        run: npm run validate
