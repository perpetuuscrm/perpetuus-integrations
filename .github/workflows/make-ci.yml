name: Make CI

on:
  pull_request:
    paths:
      - 'make/**'
      - 'docs/v1-contract.md'
      - '.github/workflows/make-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'make/**'
      - 'docs/v1-contract.md'
      - '.github/workflows/make-ci.yml'

concurrency:
  group: make-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: make
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: make/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate the custom app
        run: npm run validate:ci
